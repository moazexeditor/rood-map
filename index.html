<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap Exodia | خارطة طريق تعلّم After Effects خلال شهر</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Alexandria', 'Cairo', sans-serif;
      }

      /* Print CSS Optimization for perfect PDF rendering */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        body {
          background-color: #0B132B !important;
          color: #FFFFFF !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .no-print {
          display: none !important;
        }
        .page-break {
          page-break-after: always !important;
          break-after: page !important;
        }
        .pdf-page {
          width: 210mm !important;
          min-height: 297mm !important;
          padding: 16mm !important;
          box-sizing: border-box !important;
          page-break-after: always !important;
          break-after: page !important;
          margin: 0 auto !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">

  </body>
